name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - uat
          - prod
          - sit
      region:
        description: "Azure region"
        required: true
        default: "westus2"
        type: choice
        options:
          - westus2
          - eastus
          - southindia
      vm_size:
        description: "VM size"
        required: true
        default: "Standard_B2s"
        type: choice
        options:
          - Standard_B2s
          - Standard_B2ms
          - Standard_D2s_v3
      availability_zone:
        description: "Availability Zone"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.12.0

      - name: Set environment secrets
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID_DEV }}" >> $GITHUB_ENV
            echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET_DEV }}" >> $GITHUB_ENV
            echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}" >> $GITHUB_ENV
            echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID_DEV }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" = "uat" ]; then
            echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID_UAT }}" >> $GITHUB_ENV
            echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET_UAT }}" >> $GITHUB_ENV
            echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID_UAT }}" >> $GITHUB_ENV
            echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID_UAT }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID_PROD }}" >> $GITHUB_ENV
            echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET_PROD }}" >> $GITHUB_ENV
            echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}" >> $GITHUB_ENV
            echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID_PROD }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" = "sit" ]; then
            echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID_SIT }}" >> $GITHUB_ENV
            echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET_SIT }}" >> $GITHUB_ENV
            echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID_SIT }}" >> $GITHUB_ENV
            echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID_SIT }}" >> $GITHUB_ENV
          fi

      - name: Terraform Init
        run: |
          ENV=${{ github.event.inputs.environment }}
          terraform init \
            -backend-config=environments/backend.tfvars \
            -backend-config="key=vm-${ENV}.tfstate" \
            -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          ENV=${{ github.event.inputs.environment }}
          REGION=${{ github.event.inputs.region }}
          SIZE=${{ github.event.inputs.vm_size }}
          ZONE=${{ github.event.inputs.availability_zone }}
          terraform plan \
            -var-file=environments/${ENV}.tfvars \
            -var "location=${REGION}" \
            -var "vm_size=${SIZE}" \
            -var "availability_zone=${ZONE}" \
            -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: tfplan

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: ${{ github.event.inputs.environment }}
      # 👇 Configure approvals in GitHub Settings → Environments
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.12.0

      - name: Download Plan Artifact
        uses: actions/download-artifact@v3
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
