name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - uat
          - prod
      region:
        description: "Azure region"
        required: true
        default: "westus2"
        type: choice
        options:
          - westus2
          - westus3
      vm_size:
        description: "VM size"
        required: true
        default: "Standard_B2s"
        type: choice
        options:
          - Standard_B2s
          - Standard_B2ms
          - Standard_D2s_v3
      availability_zone:
        description: "Availability Zone"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.12.0

      - name: Terraform Init
        run: |
          ENV=${{ github.event.inputs.environment }}
          terraform init \
            -backend-config=environments/backend.tfvars \
            -backend-config="key=vm-${ENV}.tfstate" \
            -reconfigure

  validate:
    runs-on: ubuntu-latest
    needs: init
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.12.0

      - name: Terraform Validate
        run: terraform validate

  plan:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.12.0

      - name: Terraform Plan
        run: |
          ENV=${{ github.event.inputs.environment }}
          REGION=${{ github.event.inputs.region }}
          SIZE=${{ github.event.inputs.vm_size }}
          ZONE=${{ github.event.inputs.availability_zone }}
          terraform plan \
            -var-file=environments/${ENV}.tfvars \
            -var "location=${REGION}" \
            -var "vm_size=${SIZE}" \
            -var "availability_zone=${ZONE}" \
            -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: ${{ github.event.inputs.environment }}
      # 👇 Configure approvals in GitHub Settings → Environments
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.12.0

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
